<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nagori</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#127806;</text></svg>">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; }
  body { font: 400 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #e6e9e6; }

  /* The game canvas is the game. Everything else here is interface chrome. */
  #render { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  #boot {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 22px;
    justify-items: center; background: #0b0d10; z-index: 10; transition: opacity .6s ease;
  }
  #boot[hidden] { display: none; }
  #boot.fading { opacity: 0; pointer-events: none; }
  .mark { font-family: Georgia, "Times New Roman", serif; font-size: 46px; letter-spacing: .22em;
          color: #f0ece2; text-indent: .22em; }
  .sub { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #7d8a86; }
  .bar { width: 260px; height: 2px; background: #22282c; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0%; background: #d6b368; transition: width .25s ease; }
  #bootMsg { font-size: 12px; color: #6f7a78; min-height: 1.4em; }
  #bootErr { max-width: 44ch; color: #e0806a; font-size: 12.5px; line-height: 1.6; text-align: center; }
</style>
</head>
<body>
  <canvas id="render" tabindex="0"></canvas>

  <div id="boot">
    <div class="mark">NAGORI</div>
    <div class="sub">Loading</div>
    <div class="bar"><span id="bootBar"></span></div>
    <div id="bootMsg">Starting engine…</div>
    <div id="bootErr"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
